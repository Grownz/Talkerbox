[package]
name = "talkerbox"
version = "0.5.0"
description = "Talkerbox: local chatbot with spoken replies (Ollama + TTS sidecar)"
edition = "2021"

[lib]
name = "talkerbox_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# native-tls uses Windows SChannel: no extra C toolchain (cmake/nasm) needed.
reqwest = { version = "0.13", default-features = false, features = ["json", "stream", "native-tls"] }
tokio = { version = "1", features = ["sync", "time", "fs", "io-util", "macros"] }
sha2 = "0.10"
# Job object so spawned processes die with the app, even on a crash.
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_JobObjects", "Win32_Security"] }
vosk = "0.3.1"
cpal = "0.18.2"
zip = { version = "9.5.1", default-features = false, features = ["deflate-flate2"] }
# zip disables flate2's default features; pick its pure-Rust backend (miniz_oxide is already in the tree).
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
# Smart select (MobileSAM): onnxruntime.dll is downloaded on demand and loaded at runtime, nothing is linked.
# Pinned: ort 2.0 is still a release candidate and its API changes between candidates.
ort = { version = "=2.0.0-rc.15", default-features = false, features = ["load-dynamic"] }

# Smallest release binary (measured: default 12.3 MB, opt-level "s" 8.0 MB, "z" 6.8 MB).
# panic stays "unwind": it would save another ~3 MB, but tokio (failed command tasks) and tao (Win32
# callbacks) catch panics, and with "abort" any panic would close the whole app instead.
[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
